<!DOCTYPE html>
<!-- Кастомный шаблон страницы входа StatiCrypt 3.5.4 (флаг -t).
     Маркеры /*[|имя|]*/0 заменяются при шифровании. Обязательные идентификаторы
     элементов (staticrypt-password, staticrypt-remember, staticrypt-form) используются

<html lang="ru">
<head>
<meta charset="utf-8">
<title>ADMOS · вход</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="cache-control" content="no-cache">
<style>
:root{--ink:#1d2430;--ink2:#5b6472;--line:#d7dce3;--bg:#eef0f3;--card:#fff;--accent:#1f4e79;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
     font:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.card{width:min(360px,92vw);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;box-shadow:0 10px 30px rgba(20,30,45,.08)}
h1{font-size:20px;margin:0 0 4px;font-weight:600}
p.hint{margin:0 0 18px;color:var(--ink2);font-size:14px}
input[type=password],input[type=text]{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);
     border-radius:8px;background:#fff;color:var(--ink)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.vis{display:flex;gap:8px;align-items:center;margin:12px 2px;font-size:14px;color:var(--ink2)}
button{width:100%;padding:12px;margin-top:14px;font-size:15px;font-weight:600;color:#fff;background:var(--accent);
     border:0;border-radius:8px;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#staticrypt-error{color:var(--err);font-size:14px;min-height:20px;margin:10px 0 0}
#staticrypt-loading{color:var(--ink2);font-size:14px}
.hidden{display:none!important}
</style>
</head>

<main class="card" id="staticrypt-content">
  <h1>ADMOS · вход</h1>
  <p class="hint">Введите пароль, чтобы открыть справочник.</p>

  <form id="staticrypt-form" action="#" method="post" class="hidden">
    <label class="vis-hidden" for="staticrypt-password" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Пароль</label>
    <input id="staticrypt-password" type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus>
    <label class="vis" for="staticrypt-show"><input type="checkbox" id="staticrypt-show">Показать пароль</label>
    <label class="vis hidden" id="staticrypt-remember-label" for="staticrypt-remember">
      <input type="checkbox" id="staticrypt-remember">Запомнить на этом устройстве (30 дней)

    <button type="submit">Войти</button>
